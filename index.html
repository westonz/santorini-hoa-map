<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santorini Village HOA - Master Operations &amp; GIS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; height: 100vh; width: 100vw; }
    #sidebar {
      width: 370px; background: #1e293b; color: #f8fafc; padding: 14px;
      box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.3); z-index: 1000;
    }
    h1 { font-size: 1.15rem; margin: 0; color: #38bdf8; }
    .subtitle { font-size: 0.78rem; color: #94a3b8; margin-top: 3px; }
    .card { background: #334155; border-radius: 8px; padding: 10px 12px; }
    .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin: 0 0 8px 0; }
    .layer-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; }
    .layer-item:last-child { margin-bottom: 0; }
    .layer-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn {
      background: #0284c7; color: white; border: none; padding: 9px 12px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.83rem; width: 100%;
    }
    .btn:hover { background: #0369a1; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; font-size: 0.78rem; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 6px 8px; border-radius: 4px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; font-size: 0.78rem;
    }
    #info-box { font-size: 0.78rem; color: #e2e8f0; max-height: 240px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; }
    #info-box table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    #info-box td { padding: 3px 4px; border-bottom: 1px solid #334155; word-break: break-word; }
    #info-box td.key { color: #94a3b8; font-weight: 600; width: 42%; }
    #map-container { flex: 1; position: relative; height: 100%; }
    #map { width: 100%; height: 100%; background: #e2e8f0; }
    #status-pill {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(15, 23, 42, 0.88); color: #38bdf8; padding: 6px 12px;
      border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      border: 1px solid #334155; pointer-events: none;
    }
    .phase-label {
      background: rgba(15, 23, 42, 0.85); color: #f8fafc; border: 1px solid #ef4444;
      border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 600;
      white-space: nowrap; pointer-events: none;
    }
    .compact-marker {
      background: #1e293b; color: #fff; border: 2px solid #38bdf8; border-radius: 50%;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div>
      <h1>Santorini Village HOA</h1>
      <div class="subtitle">Master Operations, GIS &amp; Asset Map</div>
    </div>

    <button class="btn" id="resetBtn">Zoom to HOA Boundary</button>

    <div class="card">
      <h2>HOA Operations Layers (Custom)</h2>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-firelanes" checked /> Fire Lanes &amp; Red Curbs</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-signs" checked /> Fire Lane Signs &amp; Photos</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-cameras" checked /> Security Cameras &amp; Coverage</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-assets" checked /> HOA Shed, Pumps &amp; Infrastructure</label>
      </div>
    </div>

    <div class="card">
      <h2>Add New HOA Pin or Red Curb</h2>
      <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:6px;">Select type, fill title/notes, then click map:</div>
      <div class="form-group">
        <label>Category:</label>
        <select id="newCategory">
          <option value="sign">Fire Lane Sign &amp; Photo Pin</option>
          <option value="camera">Security Camera Pin</option>
          <option value="asset">HOA Asset Pin (Shed/Pump)</option>
        </select>
        <label>Title / Label:</label>
        <input type="text" id="newTitle" placeholder="e.g. Camera 01 - North Entrance" />
        <label>Details / Link / Image URL:</label>
        <textarea id="newDesc" rows="2" placeholder="Dashboard URL, photo link, or notes..."></textarea>
        <button class="btn btn-green" id="enableAddBtn">Activate Drop Pin Mode</button>
      </div>
      <hr style="border:0; border-top:1px solid #475569; margin:10px 0;">
      <button class="btn" id="startDrawLineBtn" style="background:#ef4444;">Draw Red Curb / Fire Lane Line</button>
    </div>

    <div class="card">
      <h2>South Jordan City GIS Layers</h2>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-parcels" checked /> Lot Lines &amp; Addresses</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-storm" checked /> Storm Drains &amp; Land Drains</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-fiber" /> Google Fiber Infrastructure</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-sewer" /> Sanitary Sewer Lines</label>
      </div>
      <div class="layer-item">
        <label><input type="checkbox" id="lyr-water" /> Secondary Water</label>
      </div>
    </div>

    <div class="card">
      <h2>Basemap</h2>
      <div class="layer-item">
        <label><input type="radio" name="basemap" value="esriStreets" /> Street</label>
        <label><input type="radio" name="basemap" value="cartoLight" /> Light</label>
        <label><input type="radio" name="basemap" value="aerial" checked /> Aerial / Satellite</label>
      </div>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column;">
      <h2>Inspector</h2>
      <div id="info-box">Click any item on the map to inspect details.</div>
    </div>
  </div>

  <div id="map-container">
    <div id="status-pill">Loading Santorini Village...</div>
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
  const BASE_REST = "https://gis2.southjordanutah.gov/server/rest/services";
  const statusPill = document.getElementById("status-pill");

  const map = L.map("map", {
    center: [40.5738, -111.9465],
    zoom: 18,
    minZoom: 15,
    maxZoom: 19
  });

  const basemaps = {
    esriStreets: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
    cartoLight: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 19 }),
    aerial: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }).addTo(map)
  };

  const cityLayers = {
    parcels: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Parcels_public/MapServer`, opacity: 0.85 }).addTo(map),
    storm: L.esri.dynamicMapLayer({ url: `${BASE_REST}/StormDrain/StormDrain/MapServer`, opacity: 0.95 }).addTo(map),
    fiber: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Engineering/Google_Fiber/MapServer`, opacity: 0.95 }),
    sewer: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Public_Works/Sewer/MapServer`, opacity: 0.9 }),
    water: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Water/SecondaryWater_public/MapServer`, opacity: 0.9 })
  };

  // Persistent Custom Data Storage
  let customAssets = JSON.parse(localStorage.getItem("santorini_hoa_assets") || JSON.stringify([
    { id: 1, type: "asset", title: "HOA Storage Shed", lat: 40.5742, lng: -111.9420, desc: "Main equipment and tool shed." },
    { id: 2, type: "asset", title: "Secondary Water Pump & Valve Box", lat: 40.5750, lng: -111.9431, desc: "Main irrigation tie-in and booster pump." },
    { id: 3, type: "camera", title: "North Entrance Camera", lat: 40.5765, lng: -111.9415, desc: "PTZ security camera covering entrance. <br><a href='https://your-NVR-dashboard-link.com' target='_blank' style='color:#38bdf8;font-weight:bold;'>Open Live Camera Dashboard &rarr;</a>" },
    { id: 4, type: "sign", title: "Fire Lane No Parking Sign #1", lat: 40.5755, lng: -111.9440, desc: "Posted tow-away zone sign.<br><img src='https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=300' style='width:100%;border-radius:4px;margin-top:4px;' alt='Sign Photo'>" }
  ]));

  let customLines = JSON.parse(localStorage.getItem("santorini_hoa_lines") || JSON.stringify([
    { id: 101, title: "North Drive Red Curb", latlngs: [[40.5758, -111.9440], [40.5758, -111.9415]], desc: "Towing enforced 24/7." }
  ]));

  const customLayersGroup = {
    firelanes: L.layerGroup().addTo(map),
    signs: L.layerGroup().addTo(map),
    cameras: L.layerGroup().addTo(map),
    assets: L.layerGroup().addTo(map)
  };

  function renderCustomData() {
    Object.values(customLayersGroup).forEach(g => g.clearLayers());

    // Render Point Assets / Pins (Compact)
    customAssets.forEach(item => {
      let iconHtml = '🏢';
      if (item.type === "camera") iconHtml = '📷';
      else if (item.type === "sign") iconHtml = '🛑';

      const marker = L.marker([item.lat, item.lng], {
        icon: L.divIcon({ className: '', html: `<div class="compact-marker">${iconHtml}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
      });

      if (item.type === "camera") {
        L.circle([item.lat, item.lng], { radius: 30, color: '#3b82f6', fillOpacity: 0.12, weight: 1 }).addTo(customLayersGroup.cameras);
      }

      marker.bindPopup(`<div style="font-size:12px;"><strong>${item.title}</strong><br>${item.desc}<br><br><button onclick="deleteAsset(${item.id})" style="background:#ef4444;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;">Delete Pin</button></div>`);

      if (item.type === "sign") customLayersGroup.signs.addLayer(marker);
      else if (item.type === "camera") customLayersGroup.cameras.addLayer(marker);
      else customLayersGroup.assets.addLayer(marker);
    });

    // Render Drawn Red Curbs / Fire Lane Lines
    customLines.forEach(line => {
      const polyline = L.polyline(line.latlngs, { color: '#ef4444', weight: 6, opacity: 0.85 });
      polyline.bindPopup(`<div style="font-size:12px;"><strong>${line.title}</strong><br>${line.desc}<br><br><button onclick="deleteLine(${line.id})" style="background:#ef4444;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;">Delete Line</button></div>`);
      customLayersGroup.firelanes.addLayer(polyline);
    });
  }

  window.deleteAsset = function(id) {
    customAssets = customAssets.filter(a => a.id !== id);
    localStorage.setItem("santorini_hoa_assets", JSON.stringify(customAssets));
    renderCustomData();
  };

  window.deleteLine = function(id) {
    customLines = customLines.filter(l => l.id !== id);
    localStorage.setItem("santorini_hoa_lines", JSON.stringify(customLines));
    renderCustomData();
  };

  renderCustomData();

  // Leaflet.Draw integration for drawing Fire Lane / Red Curb lines
  const drawnItems = new L.FeatureGroup().addTo(map);
  const drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: {
      polygon: false,
      rectangle: false,
      circle: false,
      marker: false,
      circlemarker: false,
      polyline: { shapeOptions: { color: '#ef4444', weight: 6 } }
    }
  });
  map.addControl(drawControl);

  document.getElementById("startDrawLineBtn").addEventListener("click", () => {
    new L.Draw.Polyline(map, drawControl.options.draw.polyline).enable();
    statusPill.textContent = "DRAWING: Click points on road to trace red curb, double-click to finish";
    statusPill.style.background = "#ef4444";
  });

  map.on(L.Draw.Event.CREATED, function (e) {
    const layer = e.layer;
    drawnItems.addLayer(layer);
    const latlngs = layer.getLatLngs();
