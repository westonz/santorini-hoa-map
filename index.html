<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santorini Village HOA - Master Operations &amp; GIS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; height: 100vh; width: 100vw; }
    #sidebar {
      width: 380px; background: #1e293b; color: #f8fafc; padding: 14px;
      box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.3); z-index: 1000;
    }
    h1 { font-size: 1.15rem; margin: 0; color: #38bdf8; }
    .subtitle { font-size: 0.78rem; color: #94a3b8; margin-top: 3px; }
    .card { background: #334155; border-radius: 8px; padding: 10px 12px; }
    .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin: 0 0 8px 0; }
    .layer-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 0.83rem; }
    .layer-item:last-child { margin-bottom: 0; }
    .layer-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn {
      background: #0284c7; color: white; border: none; padding: 9px 12px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.83rem; width: 100%;
    }
    .btn:hover { background: #0369a1; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; font-size: 0.78rem; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 6px 8px; border-radius: 4px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; font-size: 0.78rem;
    }
    .row-inputs { display: flex; gap: 6px; }
    .row-inputs > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    #info-box { font-size: 0.78rem; color: #e2e8f0; max-height: 220px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; }
    #map-container { flex: 1; position: relative; height: 100%; }
    #map { width: 100%; height: 100%; background: #e2e8f0; }
    #status-pill {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(15, 23, 42, 0.88); color: #38bdf8; padding: 6px 12px;
      border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      border: 1px solid #334155; pointer-events: none;
    }
    .phase-label {
      background: rgba(15, 23, 42, 0.85); color: #f8fafc; border: 1px solid #ef4444;
      border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 600;
      white-space: nowrap; pointer-events: none;
    }
    .compact-marker {
      background: #1e293b; color: #fff; border: 2px solid #38bdf8; border-radius: 50%;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div>
      <h1>Santorini Village HOA</h1>
      <div class="subtitle">Master Operations, GIS &amp; Asset Map</div>
    </div>

    <button class="btn" id="resetBtn">Zoom to HOA Boundary</button>

    <div class="card">
      <h2>HOA Operations Layers (Custom)</h2>
      <div class="layer-item"><label><input type="checkbox" id="lyr-hoaboundary" checked /> HOA Subdivision Boundary Outline</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-redcurbs" checked /> Red Curbs (Lines)</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-parkinglanes" checked /> Parking &amp; Enforcement Lanes (Lines)</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-fireworks" checked /> Firework Restriction Zones (Polygons)</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-signphotos" checked /> Sign Photos</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-cameras" checked /> Security Cameras &amp; FOV</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-assets" checked /> HOA Shed, Pumps &amp; Infrastructure</label></div>
    </div>

    <div class="card">
      <h2>Add New HOA Pin or Shape</h2>
      <div class="form-group">
        <label>Category:</label>
        <select id="newCategory">
          <option value="signphoto">Sign &amp; Upload Photo</option>
          <option value="camera">Security Camera (with Radius)</option>
          <option value="asset">HOA Asset (Shed/Pump)</option>
        </select>
        <label>Title / Label:</label>
        <input type="text" id="newTitle" placeholder="e.g. Sign Photo - North Drive" />
        <div id="photoUploadGroup" class="form-group" style="margin:0;">
          <label>Upload Photo from Device:</label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>
        <div class="row-inputs" id="camRadiusGroup" style="display:none; margin-top:6px;">
          <div>
            <label>Camera Radius (m):</label>
            <input type="number" id="camRadius" value="35" />
          </div>
        </div>
        <label>Notes / Link / Details:</label>
        <textarea id="newDesc" rows="2" placeholder="Dashboard URL or notes..."></textarea>
        <button class="btn btn-green" id="enableAddBtn">Activate Drop Pin Mode</button>
      </div>
      <hr style="border:0; border-top:1px solid #475569; margin:8px 0;">
      <div class="form-group">
        <label>Line / Zone Type &amp; Color:</label>
        <select id="shapeColor">
          <option value="#ef4444">Red (Red Curb / Fire Lane)</option>
          <option value="#f59e0b">Yellow (Parking Enforcement Lane)</option>
          <option value="#3b82f6">Blue (Water / Utility Line)</option>
          <option value="#10b981">Green (General HOA Zone)</option>
        </select>
      </div>
      <div class="row-inputs" style="margin-top:6px;">
        <button class="btn" id="startDrawLineBtn" style="background:#ef4444;">Draw Line</button>
        <button class="btn" id="startDrawPolyBtn" style="background:#f59e0b;">Draw Zone Polygon</button>
      </div>
    </div>

    <div class="card">
      <h2>South Jordan City GIS Layers</h2>
      <div class="layer-item"><label><input type="checkbox" id="lyr-parcels" /> Parcels Public</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-storm" /> Storm Drains &amp; Land Drains</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-fiber" /> Google Fiber</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-sewer" /> Sanitary Sewer</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-water" /> Secondary Water</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-garbage" /> Garbage Pickup Days</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-firecity" /> City Fire Restrictions</label></div>
      <div class="layer-item"><label><input type="checkbox" id="lyr-zoning" /> Development Zoning</label></div>
    </div>

    <div class="card">
      <h2>Basemap</h2>
      <div class="layer-item">
        <label><input type="radio" name="basemap" value="esriStreets" /> Street</label>
        <label><input type="radio" name="basemap" value="cartoLight" /> Light</label>
        <label><input type="radio" name="basemap" value="aerial" checked /> Aerial / Satellite</label>
      </div>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column;">
      <h2>Inspector</h2>
      <div id="info-box">Click any item on the map to inspect, edit, or move details.</div>
    </div>
  </div>

  <div id="map-container">
    <div id="status-pill">Santorini Village Master Map Ready</div>
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
  const BASE_REST = "https://gis2.southjordanutah.gov/server/rest/services";
  const statusPill = document.getElementById("status-pill");

  const map = L.map("map", {
    center: [40.5738, -111.9465],
    zoom: 18,
    minZoom: 15,
    maxZoom: 19
  });

  const basemaps = {
    esriStreets: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
    cartoLight: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 19 }),
    aerial: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }).addTo(map)
  };

  const cityLayers = {
    parcels: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Parcels_public/MapServer`, opacity: 0.85 }),
    storm: L.esri.dynamicMapLayer({ url: `${BASE_REST}/StormDrain/StormDrain/MapServer`, opacity: 0.95 }),
    fiber: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Engineering/GoogleFiber_Public/MapServer`, opacity: 0.95 }),
    sewer: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Public_Works/Sewer/MapServer`, opacity: 0.9 }),
    water: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Water/SecondaryWater_public/MapServer`, opacity: 0.9 }),
    garbage: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Public_Works/Garbage_Pickup_Days/MapServer`, opacity: 0.55 }),
    firecity: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Police_Fire/Fire_Restriction_Zones/MapServer`, opacity: 0.65 }),
    zoning: L.esri.dynamicMapLayer({ url: `${BASE_REST}/Development/Zoning/MapServer`, opacity: 0.55 })
  };

  let customAssets = JSON.parse(localStorage.getItem("santorini_hoa_assets") || JSON.stringify([
    { id: 1, type: "asset", title: "HOA Storage Shed", lat: 40.5742, lng: -111.9420, desc: "Main equipment and tool shed." },
    { id: 2, type: "asset", title: "Secondary Water Pump & Valve Box", lat: 40.5750, lng: -111.9431, desc: "Main irrigation tie-in and booster pump." },
    { id: 3, type: "camera", title: "North Entrance Camera", lat: 40.5765, lng: -111.9415, radius: 40, desc: "PTZ security camera covering entrance." },
    { id: 4, type: "signphoto", title: "Fire Lane No Parking Sign #1", lat: 40.5755, lng: -111.9440, imageData: null, desc: "Posted tow-away zone sign." }
  ]));

  let customLines = JSON.parse(localStorage.getItem("santorini_hoa_lines") || JSON.stringify([
    { id: 101, title: "North Drive Red Curb", color: "#ef4444", latlngs: [[40.5758, -111.9440], [40.5758, -111.9415]], desc: "Towing enforced 24/7." },
    { id: 102, title: "North Parking Lane", color: "#f59e0b", latlngs: [[40.5760, -111.9440], [40.5760, -111.9415]], desc: "Resident parking lane." }
  ]));

  let customPolygons = JSON.parse(localStorage.getItem("santorini_hoa_polygons") || JSON.stringify([
    { id: 201, title: "Clubhouse Firework Restriction Zone", color: "#ef4444", latlngs: [[40.5745, -111.9425], [40.5745, -111.9415], [40.5740, -111.9415], [40.5740, -111.9425]], desc: "Strictly no fireworks permitted in common grass areas." }
  ]));

  const customLayersGroup = {
    boundary: L.layerGroup().addTo(map),
    mask: L.layerGroup().addTo(map),
    redcurbs: L.layerGroup().addTo(map),
    parkinglanes: L.layerGroup().addTo(map),
    fireworks: L.layerGroup().addTo(map),
    signphotos: L.layerGroup().addTo(map),
    cameras: L.layerGroup().addTo(map),
    assets: L.layerGroup().addTo(map)
  };

  function renderCustomData() {
    customLayersGroup.redcurbs.clearLayers();
    customLayersGroup.parkinglanes.clearLayers();
    customLayersGroup.fireworks.clearLayers();
    customLayersGroup.signphotos.clearLayers();
    customLayersGroup.cameras.clearLayers();
    customLayersGroup.assets.clearLayers();

    customAssets.forEach(item => {
      let iconHtml = '🏢';
      if (item.type === "camera") iconHtml = '📷';
      else if (item.type === "signphoto") iconHtml = '🖼️';

      const marker = L.marker([item.lat, item.lng], {
        icon: L.divIcon({ className: '', html: `<div class="compact-marker">${iconHtml}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
      });

      if (item.type === "camera") {
        const rad = item.radius || 30;
        L.circle([item.lat, item.lng], { radius: rad, color: '#3b82f6', fillOpacity: 0.12, weight: 1 }).addTo(customLayersGroup.cameras);
      }

      let imgTag = item.imageData ? `<br><img src="${item.imageData}" style="width:100%;max-height:160px;border-radius:4px;margin-top:6px;" />` : '';

      marker.bindPopup(`<div style="font-size:12px;max-width:200px;"><strong>${item.title}</strong><br>${item.desc}${imgTag}<br><br><button onclick="moveAsset(${item.id})" style="background:#10b981;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;margin-right:4px;">Move Pin</button><button onclick="editAsset(${item.id})" style="background:#0284c7;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;margin-right:4px;">Edit</button><button onclick="deleteAsset(${item.id})" style="background:#ef4444;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;">Delete</button></div>`);

      if (item.type === "signphoto") customLayersGroup.signphotos.addLayer(marker);
      else if (item.type === "camera") customLayersGroup.cameras.addLayer(marker);
      else customLayersGroup.assets.addLayer(marker);
    });

    customLines.forEach(line => {
      const polyline = L.polyline(line.latlngs, { color: line.color || '#ef4444', weight: 6, opacity: 0.85 });
      polyline.bindPopup(`<div style="font-size:12px;"><strong>${line.title}</strong><br>${line.desc}<br><br><button onclick="editLine(${line.id})" style="background:#0284c7;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;margin-right:4px;">Edit</button><button onclick="deleteLine(${line.id})" style="background:#ef4444;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;">Delete</button></div>`);
      
      if (line.color === '#f59e0b') {
        customLayersGroup.parkinglanes.addLayer(polyline);
      } else {
        customLayersGroup.redcurbs.addLayer(polyline);
      }
    });

    customPolygons.forEach(poly => {
      const polygon = L.polygon(poly.latlngs, { color: poly.color || '#ef4444', weight: 2, fillColor: poly.color || '#ef4444', fillOpacity: 0.35 });
      polygon.bindPopup(`<div style="font-size:12px;"><strong>${poly.title}</strong><br>${poly.desc}<br><br><button onclick="editPolygon(${poly.id})" style="background:#0284c7;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;margin-right:4px;">Edit</button><button onclick="deletePolygon(${poly.id})" style="background:#ef4444;color:white;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;">Delete</button></div>`);
      customLayersGroup.fireworks.addLayer(polygon);
    });
  }

  window.deleteAsset = function(id) { customAssets = customAssets.filter(a => a.id !== id); localStorage.setItem("santorini_hoa_assets", JSON.stringify(customAssets)); renderCustomData(); };
  window.deleteLine = function(id) { customLines = customLines.filter(l => l.id !== id); localStorage.setItem("santorini_hoa_lines", JSON.stringify(customLines)); renderCustomData(); };
  window.deletePolygon = function(id) { customPolygons = customPolygons.filter(p => p.id !==
